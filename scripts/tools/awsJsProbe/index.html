<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS JS Probe — GetItem su DynamoDB</title>

<!-- Nessun CDN, nessun bundler, nessun runtime: la pagina è tre moduli ES e
     la WebCrypto del browser. È il punto della prova. -->
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 1.5rem; background: #f1f5f9; color: #1e293b;
         font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 56rem; margin: 0 auto; }
  h1 { margin: 0 0 .25rem; font-size: 1.05rem; }
  p.lead { margin: 0 0 1.25rem; color: #64748b; font-size: .8rem; }
  section { padding: 1rem 1.25rem; border: 1px solid #e2e8f0; border-radius: .6rem;
            background: #fff; margin-bottom: 1rem; }
  label { display: block; margin-bottom: .75rem; font-size: .75rem; font-weight: 600;
          color: #475569; }
  label span { display: block; margin-bottom: .2rem; font-weight: 500; }
  input, select { width: 100%; box-sizing: border-box; padding: .45rem .6rem;
                  border: 1px solid #cbd5e1; border-radius: .35rem;
                  font: inherit; font-family: ui-monospace, monospace; background: #fff; }
  select:disabled { background: #f1f5f9; color: #94a3b8; }
  .row { display: flex; flex-wrap: wrap; gap: 0 1rem; }
  .row > label { flex: 1 1 12rem; }
  button { padding: .45rem 1.1rem; border: 0; border-radius: .35rem; background: #0b3d91;
           color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  #message { margin: .75rem 0 0; font-size: .8rem; color: #64748b; }
  #message.good { color: #15803d; }
  #message.bad { color: #be123c; }
  pre { margin: 0; padding: 1rem 1.25rem; border: 1px solid #e2e8f0; border-radius: .6rem;
        background: #fff; overflow: auto; max-height: 26rem;
        font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; }
</style>
</head>

<body>
<main>
  <h1>AWS JS Probe</h1>
  <p class="lead">
    Un <code>GetItem</code> su DynamoDB nel browser, leggendo <code>~/.aws</code>:
    JavaScript e basta. La firma a mano con WebCrypto, oppure l'SDK AWS
    caricato come modulo ES — senza bundler, in entrambi i casi.
  </p>

  <section>
    <button id="btn-pick" type="button">Carica .aws</button>
    <!-- Ripiego per quando showDirectoryPicker è vietato: in un iframe di
         origine diversa dal top Chromium lo blocca, e non c'è un allow=. -->
    <input id="dir-input" type="file" webkitdirectory directory hidden>
    <p id="message">Scegli la cartella <code>.aws</code> del tuo utente.</p>

    <div class="row" style="margin-top: 1rem">
      <label><span>Profilo</span>
        <select id="profile" disabled><option>—</option></select></label>
      <label style="flex-basis: 24rem"><span>Credenziali</span>
        <select id="source" disabled><option>—</option></select></label>
    </div>
  </section>

  <section>
    <div class="row">
      <label><span>Region</span>
        <input id="region" value="eu-south-1" spellcheck="false"></label>
      <label><span>Tabella</span>
        <input id="table" value="pn-PaperTrackings" spellcheck="false"></label>
    </div>
    <div class="row">
      <label><span>Chiave</span>
        <input id="key-name" value="trackingId" spellcheck="false"></label>
      <label style="flex-basis: 24rem"><span>Valore</span>
        <input id="key-value" placeholder="PREPARE_ANALOG_DOMICILE.IUN_….PCRETRY_0"
               spellcheck="false"></label>
    </div>
    <label><span>Come firmare</span>
      <select id="mode">
        <option value="hand">a mano — SigV4 con WebCrypto, zero dipendenze</option>
        <option value="sdk">SDK — @aws-sdk/client-dynamodb da jsDelivr (~500 KB)</option>
      </select></label>
    <button id="btn-get" type="button" disabled>GetItem</button>
  </section>

  <pre id="output"></pre>
</main>

<script type="module" src="./src/main.js"></script>
</body>
</html>
