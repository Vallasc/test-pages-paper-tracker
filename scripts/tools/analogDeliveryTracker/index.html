<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Questa pagina tiene in memoria credenziali AWS vive, quindi vale la pena
     recintare dove può andare il codice. Va per prima: un meta CSP governa solo
     quel che viene analizzato dopo di lui.

     Niente 'unsafe-inline' sugli script: in pagina non ce n'è nessuno inline, e
     l'inizializzazione di Mermaid sta in `tracker.js`. Sugli stili serve, invece,
     perché Tailwind Browser genera <style> a runtime e Mermaid ne mette uno
     dentro ogni SVG. `connect-src` è la riga che conta: anche con uno script
     ostile sulla pagina, le credenziali non avrebbero dove andare. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  font-src https://cdn.jsdelivr.net;
  img-src 'self' data:;
  connect-src 'self' https://*.amazonaws.com;
  object-src 'none'; base-uri 'none'; form-action 'none'">

<title>Analog Delivery Tracker</title>

<!-- Versioni esatte e `integrity` su tutto quel che arriva da fuori: senza, una
     release storta o un CDN compromesso è codice arbitrario accanto alle
     credenziali. Il browser scarta il file se l'hash non torna.

     L'SDK AWS resta senza: `aws_dir`/`sdk.js` lo prendono da `+esm`, che jsDelivr
     genera al volo e per cui sconsiglia SRI, e comunque un `import()` dinamico
     non ha dove metterlo. Lì il recinto è la CSP. -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
        integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
        crossorigin="anonymous"></script>

<!-- Il look "neo" dei temi Mermaid 12 chiede "Recursive Variable", che Mermaid
     nomina ma non distribuisce: senza questo foglio il browser ripiega su Arial
     e il diagramma non somiglia a quello della documentazione. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/recursive@5.3.0/index.css"
      integrity="sha384-2GeM7iYse26g6JZIccxFULRQmNQ+02EwB4Aa8iLNlKri8n3C143TNMD8P/MS/0gK"
      crossorigin="anonymous">

<!-- Mermaid disegna i diagrammi di flusso dei prodotti, solo su richiesta.
     Serve la 12: da lì gli stateDiagram hanno layout elk e look neo. Nessun
     tema qui: vince il frontmatter del .mermaid, che sceglie "redux" al posto
     del "redux-color" di default, perché i riquadri colorati uno a uno tolgono
     l'occhio al verde del cammino percorso.

     Build UMD e non ESM apposta: `integrity` vale su un <script src>, mentre un
     `import` dentro un modulo non ha modo di portarselo. Definisce
     `window.mermaid`, e `tracker.js` lo configura appena parte. -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@12.0.0/dist/mermaid.min.js"
        integrity="sha384-xzghz1GQ5u9HCpVskeDPqMsdogD1yvuMQbEK53+wi+G70+6J1AG0L2cfi9PHjDWI"
        crossorigin="anonymous"></script>

<style type="text/tailwindcss">
  @theme {
    --color-brand: #0b3d91;
  }
</style>
<style>
  /* Rotella d'attesa. In CSS a mano e non in classi Tailwind: gira mentre i
     moduli si caricano, cioè prima che il CDN abbia generato le sue classi.
     Prende il colore del testo che la contiene. */
  .spin { display: inline-block; width: .85em; height: .85em; border-radius: 50%;
          border: 2px solid currentColor; border-right-color: transparent;
          vertical-align: -.1em; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Altezza della barra in cima: le intestazioni dei tracking ci si fermano
     sotto. Il valore qui è solo il ripiego prima che la pagina la misuri,
     perché la barra va a capo sugli schermi stretti (vedi trackHeaderHeight). */
  :root { --page-header: 65px; }

  /* La riga verticale della timeline è il bordo sinistro della lista; i punti
     vanno riportati sopra al bordo, cioè indietro di padding + mezzo punto
     (pl-6 = 1.5rem, h-3/w-3 = 0.75rem). */
  .tl { border-left: 2px solid #e2e8f0; }
  .tl-dot { left: -1.875rem; }

  /* Il modale è uno solo; col diagramma dentro gli si alza il tetto, perché una
     macchina a stati è larga quanto tutti i suoi rami. Regola su #id: deve avere
     la meglio sulle utility di Tailwind scritte sull'elemento.

     Sono tetti, non misure: un <dialog> nasce `fit-content`, quindi con
     min-width e max-width si stringe su quel che contiene invece di restare
     sempre spalancato su una riga di log o su un JSON di tre campi. */
  #detail-modal.wide { max-width: min(110rem, 98vw); max-height: 96vh; }

  /* Un tentativo chiuso non deve lasciare una fascia vuota: via il padding
     della sezione e il margine sotto la sua intestazione. Il selettore porta il
     nome dell'elemento apposta, per battere in specificità le utility di
     Tailwind scritte sull'elemento (`pb-5`, `mb-4`) senza !important. */
  section.collapsed { padding-bottom: 0; }
  section.collapsed > div { margin-bottom: 0; }

  /* La freccia del collasso: giù quando il tentativo è aperto, a destra quando
     è chiuso. Lo stato vero è aria-expanded, così lo stile segue l'accessibilità
     invece di raddoppiarla con una classe. */
  [data-collapse] svg { transition: transform .15s ease; }
  [data-collapse][aria-expanded="false"] svg { transform: rotate(-90deg); }

  /* Il diagramma si adatta all'altezza del modale invece di uscirne.

     Mermaid, con `useMaxWidth`, mette sull'SVG `width="100%"` e un
     `style="max-width: Npx"` inline, e nessuna altezza: la larghezza la decide
     il contenitore e l'altezza esce dalle proporzioni del viewBox, quindi una
     macchina a stati alta sfora comunque.

     Qui l'altezza è fissa e la larghezza è `auto`: un elemento rimpiazzato con
     proporzioni note, data un'altezza, si calcola la larghezza da sé. Il
     diagramma riempie l'altezza disponibile e il modale — che è `fit-content` —
     si stringe sulla larghezza che ne esce. Il `max-width` inline di Mermaid va
     tolto, perché è la larghezza *naturale* del disegno e fermerebbe la scala
     prima del tempo; quello al 100% resta, per i diagrammi molto larghi dove a
     comandare torna a essere la larghezza del modale. */
  .diagram-fit svg {
    display: block;
    margin-inline: auto;
    height: 78vh;                 /* l'altezza la prende tutta… */
    width: auto;                  /* …e la larghezza la dettano le proporzioni */
    max-width: 100% !important;   /* via il max-width inline di Mermaid */
  }

  /* Albero JSON: il marcatore di default di <details> è minuscolo e disallineato. */
  .jsn summary { list-style: none; }
  .jsn summary::-webkit-details-marker { display: none; }
  .jsn summary::before { content: "\25B8"; display: inline-block; width: 1rem; color: #64748b; }
  .jsn details[open] > summary::before { content: "\25BE"; }
</style>
</head>

<body class="bg-slate-100 text-slate-800 antialiased">

<!-- ================================================================== header -->
<header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-4 px-6 py-3">
    <div class="mr-auto">
      <h1 class="text-base font-semibold tracking-tight text-slate-900">Analog Delivery Tracker</h1>
      <p class="text-xs text-slate-500">Storico della spedizione analogica</p>
    </div>

    <select id="sel-profile" disabled title="Profilo AWS"
            class="rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-800
                   shadow-sm disabled:bg-slate-100 disabled:text-slate-400">
      <option>—</option>
    </select>

    <span id="conn-pill" title="Nessuna cartella .aws selezionata"
          class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-slate-50
                 px-3 py-1.5 text-xs font-medium text-slate-600">
      <span id="conn-dot" class="h-2 w-2 rounded-full bg-slate-400"></span>
      <span id="conn-text">Non connesso</span>
    </span>

    <button id="btn-pick" type="button" disabled title="Caricamento in corso"
            class="inline-flex cursor-pointer items-center gap-2 rounded-md bg-brand px-3.5 py-1.5
                   text-sm font-medium text-white shadow-sm hover:bg-blue-900
                   disabled:cursor-not-allowed disabled:bg-slate-400">
      <span class="spin"></span> Avvio…
    </button>
  </div>
</header>

<main class="mx-auto max-w-7xl px-6 py-6">

  <!-- ================================================================ ricerca -->
  <section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex flex-wrap items-end gap-3">
      <label class="flex flex-col text-xs font-medium text-slate-600">
        Cerca per
        <select id="sel-mode"
                class="mt-1 h-10 rounded-md border border-slate-300 bg-white px-3 text-sm">
          <option value="iun">IUN</option>
          <option value="tracking">trackingId</option>
        </select>
      </label>

      <label class="flex min-w-72 flex-1 flex-col text-xs font-medium text-slate-600">
        <span id="inp-label">IUN</span>
        <input id="inp-iun" type="text" placeholder="UWXU-VKXM-QVJZ-202609-M-1" spellcheck="false"
               class="mt-1 h-10 rounded-md border border-slate-300 px-3 font-mono text-sm
                      focus:border-brand focus:outline-none focus:ring-1 focus:ring-brand">
      </label>

      <label class="flex flex-col text-xs font-medium text-slate-600">
        Prodotto
        <select id="sel-product"
                class="mt-1 h-10 min-w-64 rounded-md border border-slate-300 bg-white px-3 text-sm">
        </select>
      </label>

      <button id="btn-search" type="button" disabled
              class="h-10 cursor-pointer rounded-md bg-brand px-6 text-sm font-medium text-white shadow-sm
                     hover:bg-blue-900 disabled:cursor-not-allowed disabled:bg-slate-300">
        Cerca
      </button>
    </div>

    <details class="mt-4 border-t border-slate-100 pt-3">
      <summary class="cursor-pointer text-xs font-medium text-slate-500 hover:text-slate-700">
        Opzioni avanzate
      </summary>
      <div class="mt-3 flex flex-wrap items-center gap-5 text-xs text-slate-600">
        <label class="flex items-center gap-2">
          <input id="chk-dryrun" type="checkbox" class="rounded border-slate-300">
          Output dry-run
        </label>
        <label class="flex items-center gap-2">
          <input id="chk-flow" type="checkbox" checked class="rounded border-slate-300">
          Tappe di validazione e OCR
        </label>
        <label class="flex items-center gap-2"
               title="Interroga CloudWatch attorno a ogni evento e ricostruisce gli output inviati a delivery-push">
          <input id="chk-log-events" type="checkbox" class="rounded border-slate-300">
          Recupera eventi prodotti dai log
        </label>
        <label class="flex items-center gap-2">
          Ordina per
          <select id="sel-order" class="rounded border border-slate-300 px-2 py-1">
            <option value="arrival">arrivo sul tracker</option>
            <option value="status">data evento</option>
          </select>
        </label>
        <label class="flex items-center gap-2">
          Max RECINDEX
          <input id="inp-max-rec" type="number" min="0" max="50"
                 class="w-16 rounded border border-slate-300 px-2 py-1">
        </label>
        <label class="flex items-center gap-2">
          Max ATTEMPT
          <input id="inp-max-att" type="number" min="0" max="20"
                 class="w-16 rounded border border-slate-300 px-2 py-1">
        </label>
        <label class="flex items-center gap-2" title="Finestra attorno all'evento per i log CloudWatch">
          Log ± min
          <input id="inp-log-min" type="number" min="1" max="120"
                 class="w-16 rounded border border-slate-300 px-2 py-1">
        </label>
      </div>
    </details>

    <p id="search-msg" class="mt-3 text-sm text-slate-500"></p>
  </section>

  <!-- ============================================================== risultati -->
  <section id="results" class="mt-6"></section>

</main>

<!-- =================================================================== log -->
<!-- m-auto: la Preflight di Tailwind azzera i margini, e un dialog modale si
     centra proprio col margin:auto che gli dà il browser. -->
<dialog id="detail-modal"
        class="m-auto max-h-[92vh] min-w-[min(32rem,92vw)] max-w-[min(80rem,96vw)]
               overflow-hidden rounded-xl
               border border-slate-200 p-0 shadow-xl backdrop:bg-slate-900/40">
  <header class="flex items-start justify-between gap-4 border-b border-slate-200 px-5 py-3">
    <div class="min-w-0">
      <h2 id="detail-modal-title" class="text-sm font-semibold text-slate-900"></h2>
      <p id="detail-modal-sub" class="mt-0.5 break-all font-mono text-xs text-slate-500"></p>
    </div>
    <!-- Stesso tratto delle icone di view.js: 24x24, currentColor, 1.8.
         L'etichetta resta per chi naviga con lo screen reader. -->
    <button id="btn-detail-close" type="button" title="Chiudi" aria-label="Chiudi"
            class="shrink-0 cursor-pointer rounded p-1.5 text-slate-400
                   hover:bg-slate-100 hover:text-slate-700">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </header>
  <div id="detail-modal-body" class="px-5 py-4"></div>
</dialog>

<!-- L'SDK AWS non è qui: `aws_dir.js` lo carica con un import() dinamico al
     primo collegamento, e solo il client che serve. Chi apre la pagina e non
     si connette non scarica niente. -->
<script type="module" src="./src/tracker.js"></script>

</body>
</html>
