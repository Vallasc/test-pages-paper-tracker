<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analog Delivery Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://pyscript.net/releases/2025.11.1/core.css">
<script type="module" src="https://pyscript.net/releases/2025.11.1/core.js"></script>

<style type="text/tailwindcss">
  @theme {
    --color-brand: #0b3d91;
  }
</style>
<style>
  /* La riga verticale della timeline è il bordo sinistro della lista; i punti
     vanno riportati sopra al bordo, cioè indietro di padding + mezzo punto
     (pl-6 = 1.5rem, h-3/w-3 = 0.75rem). */
  .tl { border-left: 2px solid #e2e8f0; }
  .tl-dot { left: -1.875rem; }

  /* Albero JSON: il marcatore di default di <details> è minuscolo e disallineato. */
  .jsn summary { list-style: none; }
  .jsn summary::-webkit-details-marker { display: none; }
  .jsn summary::before { content: "\25B8"; display: inline-block; width: 1rem; color: #64748b; }
  .jsn details[open] > summary::before { content: "\25BE"; }
</style>
</head>

<body class="bg-slate-100 text-slate-800 antialiased">

<!-- ================================================================== header -->
<header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-4 px-6 py-3">
    <div class="mr-auto">
      <h1 class="text-base font-semibold tracking-tight text-slate-900">Analog Delivery Tracker</h1>
      <p class="text-xs text-slate-500">Storico della spedizione analogica per IUN</p>
    </div>

    <select id="sel-profile" disabled title="Profilo AWS"
            class="rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-800
                   shadow-sm disabled:bg-slate-100 disabled:text-slate-400">
      <option>—</option>
    </select>

    <span id="conn-pill" title="Nessuna cartella .aws selezionata"
          class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-slate-50
                 px-3 py-1.5 text-xs font-medium text-slate-600">
      <span id="conn-dot" class="h-2 w-2 rounded-full bg-slate-400"></span>
      <span id="conn-text">Non connesso</span>
    </span>

    <button id="btn-pick" type="button" disabled
            class="rounded-md bg-brand px-3.5 py-1.5 text-sm font-medium text-white shadow-sm
                   hover:bg-blue-900 disabled:cursor-not-allowed disabled:bg-slate-300">
      Cartella .aws
    </button>
  </div>
</header>

<main class="mx-auto max-w-7xl px-6 py-6">

  <!-- ================================================================ ricerca -->
  <section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex flex-wrap items-end gap-3">
      <label class="flex min-w-72 flex-1 flex-col text-xs font-medium text-slate-600">
        IUN
        <input id="inp-iun" type="text" placeholder="UWXU-VKXM-QVJZ-202609-M-1" spellcheck="false"
               class="mt-1 rounded-md border border-slate-300 px-3 py-2 font-mono text-sm
                      focus:border-brand focus:outline-none focus:ring-1 focus:ring-brand">
      </label>

      <label class="flex flex-col text-xs font-medium text-slate-600">
        Prodotto
        <select id="sel-product"
                class="mt-1 min-w-64 rounded-md border border-slate-300 bg-white px-3 py-2 text-sm">
        </select>
      </label>

      <button id="btn-search" type="button" disabled
              class="rounded-md bg-brand px-6 py-2 text-sm font-medium text-white shadow-sm
                     hover:bg-blue-900 disabled:cursor-not-allowed disabled:bg-slate-300">
        Cerca
      </button>
    </div>

    <p id="tracking-hint" class="mt-2 font-mono text-xs text-slate-400"></p>

    <details class="mt-4 border-t border-slate-100 pt-3">
      <summary class="cursor-pointer text-xs font-medium text-slate-500 hover:text-slate-700">
        Opzioni avanzate
      </summary>
      <div class="mt-3 flex flex-wrap items-center gap-5 text-xs text-slate-600">
        <label class="flex items-center gap-2">
          <input id="chk-dryrun" type="checkbox" checked class="rounded border-slate-300">
          Output dry-run
        </label>
        <label class="flex items-center gap-2">
          <input id="chk-flow" type="checkbox" checked class="rounded border-slate-300">
          Tappe di validazione e OCR
        </label>
        <label class="flex items-center gap-2">
          Ordina per
          <select id="sel-order" class="rounded border border-slate-300 px-2 py-1">
            <option value="status">data evento</option>
            <option value="arrival">arrivo sul tracker</option>
          </select>
        </label>
        <label class="flex items-center gap-2">
          Max RECINDEX
          <input id="inp-max-rec" type="number" min="0" max="50"
                 class="w-16 rounded border border-slate-300 px-2 py-1">
        </label>
        <label class="flex items-center gap-2">
          Max ATTEMPT
          <input id="inp-max-att" type="number" min="0" max="20"
                 class="w-16 rounded border border-slate-300 px-2 py-1">
        </label>
      </div>
    </details>

    <p id="search-msg" class="mt-3 text-sm text-slate-500"></p>
  </section>

  <!-- ============================================================== risultati -->
  <section id="results" class="mt-6"></section>

</main>

<script type="py" src="./tracker.py"
        config='{"packages": ["boto3"],
                 "files": {"./awsDir.py": "./awsdir.py", "./constants.py": "./constants.py"}}'></script>

</body>
</html>
